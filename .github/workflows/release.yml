name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -race -count=1 ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Пакет для Claude Desktop і server.json з його SHA-256 для реєстру MCP.
      - run: scripts/mcpb.sh "$GITHUB_REF_NAME"
      - run: gh release upload "$GITHUB_REF_NAME" dist/prro-mcp.mcpb dist/server.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Публікація в реєстр MCP — окремим workflow, щоб його можна було
  # повторити для вже випущеного тега.
  registry:
    needs: release
    uses: ./.github/workflows/registry.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
